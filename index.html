<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/styles/styles.css">
    <title>Biccas</title>
</head>
<body>
    <header class="header">
        <div class="header__inner container">
            <a class="header__logo" href="/">Biccas</a>
                
            <nav class="header__nav hidden-mobile" aria-label="Main">
                <ul class="header__list">
                    <li><a class="header__link header__link--active" href="#" aria-current="page">Home</a></li>
                    <li><a class="header__link" href="#">Product</a></li>
                    <li><a class="header__link" href="#">FAQ</a></li>
                    <li><a class="header__link" href="#">Blog</a></li>
                    <li><a class="header__link" href="#">About Us</a></li>
                </ul>
            </nav>

            <div class="header__actions hidden-mobile">
                <a class="header__login" href="#">Login</a>
                <a class="header__signup" href="#">Sign Up</a>
            </div>


            <!-- Burger-button and mobile menu -->
            <input class="burger-toggle visually-hidden" type="checkbox" id="burger-toggle">

            <label class="burger hidden-mobile-above" for="burger-toggle" aria-label="Toggle menu">
                <span class="burger__line"></span>
                <span class="burger__line"></span>
                <span class="burger__line"></span>
            </label>

            <div class="mobile-menu hidden-mobile-above">
                <ul class="mobile-menu__list">
                    <li><a class="mobile-menu__link" href="#">Home</a></li>
                    <li><a class="mobile-menu__link" href="#">Product</a></li>
                    <li><a class="mobile-menu__link" href="#">FAQ</a></li>
                    <li><a class="mobile-menu__link" href="#">Blog</a></li>
                    <li><a class="mobile-menu__link" href="#">About Us</a></li>
                </ul>
                <div class="mobile-menu__actions">
                    <a class="header__login" href="#">Login</a>
                    <a class="header__signup" href="#">Sign Up</a>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
